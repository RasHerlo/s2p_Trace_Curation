[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "s2p-trace-curation"
version = "0.1.0"
description = "Inspection, compensation and edition of suite2p ROIs and traces"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pyqtgraph>=0.13",
  "PyQt5>=5.15",
]

[project.scripts]
s2p-trace-curation = "s2p_trace_curation.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["s2p_trace_curation*"]